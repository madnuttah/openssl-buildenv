name: CD Tag And Release

on:
  workflow_run:
    workflows:
      - CD Publish OpenSSL Buildenv Manifests
    types:
      - completed

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Import GPG key
        id: IMPORT_GPG
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
          trust_level: 5
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Read version files
        id: versions
        run: |
          set -euo pipefail

          OPENSSL_VERSION="$(cat versions/openssl.txt)"
          NONQUIC_VERSION="$(grep '^openssl=' versions/openssl-buildenv.txt | cut -d= -f2)"
          QUIC_VERSION="$(grep '^openssl=' versions/openssl-quic-buildenv.txt | cut -d= -f2)"
          NGTCP2_VERSION="$(cat versions/ngtcp2.txt)"
          NGHTTP3_VERSION="$(cat versions/nghttp3.txt)"

          {
            echo "OPENSSL_VERSION=${OPENSSL_VERSION}"
            echo "NONQUIC_VERSION=${NONQUIC_VERSION}"
            echo "QUIC_VERSION=${QUIC_VERSION}"
            echo "NGTCP2_VERSION=${NGTCP2_VERSION}"
            echo "NGHTTP3_VERSION=${NGHTTP3_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Build Workflow Run ID
        id: resolve_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MANIFEST_RUN_ID="${{ github.event.workflow_run.id }}"
          PREVIOUS_URL="$(gh api repos/"$TARGET_REPO"/actions/runs/"$MANIFEST_RUN_ID" --jq '.previous_attempt_url // empty')"

          BUILD_RUN_ID=""

          if [ -n "$PREVIOUS_URL" ]; then
            BUILD_RUN_ID="$(echo "$PREVIOUS_URL" | grep -oE '[0-9]+$' | tail -1)"
          else
            echo "Using fallback search via API..."

            WORKFLOWS=(
              "CD Build OpenSSL Buildenv"
              "CD Build OpenSSL QUIC Buildenv"
            )

            for wf in "${WORKFLOWS[@]}"; do
              ID="$(gh run list --repo "$TARGET_REPO" --workflow="$wf" --status=success --limit=1 --json databaseId --jq '.. | .databaseId? // empty')"
              if [ -n "$ID" ]; then
                BUILD_RUN_ID="$ID"
                break
              fi
            done
          fi

          if [ -z "$BUILD_RUN_ID" ]; then
            echo "Error: Could not resolve root build run ID." >&2
            exit 1
          fi
          
          echo "Resolved Build Run ID: $BUILD_RUN_ID"
          echo "BUILD_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download SBOM artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          run-id: ${{ steps.resolve_id.outputs.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sbom-artifacts
        continue-on-error: true
        
      - name: Download manifest metadata artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openssl-manifest-metadata
          run-id: ${{ steps.resolve_id.outputs.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: manifest-metadata
        continue-on-error: true

      - name: Push tags and create releases
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.IMPORT_GPG.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.IMPORT_GPG.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.IMPORT_GPG.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.IMPORT_GPG.outputs.email }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          OPENSSL="${{ steps.versions.outputs.OPENSSL_VERSION }}"
          NONQUIC="${{ steps.versions.outputs.NONQUIC_VERSION }}"
          QUIC="${{ steps.versions.outputs.QUIC_VERSION }}"
          NGTCP2="${{ steps.versions.outputs.NGTCP2_VERSION }}"
          NGHTTP3="${{ steps.versions.outputs.NGHTTP3_VERSION }}"

          TAG_NONQUIC="v${NONQUIC}"
          TAG_QUIC="v${QUIC}"
          TODAY=$(date -u +"%Y-%m-%d")

          PREV_TAG_NONQUIC_OLD=$(git tag --sort=-v:refname | grep -v "^${TAG_NONQUIC}$" | head -n 1 || true)
          PREV_TAG_QUIC_OLD=$(git tag --sort=-v:refname | grep -v "^${TAG_QUIC}$" | head -n 1 || true)

          get_old_ver() {
            local tag="$1"
            local file="$2"
            if [ -n "$tag" ]; then
              git show "$tag:$file" 2>/dev/null | tr -d '\n\r' || echo "none"
            else
              echo "none"
            fi
          }

          OLD_OPENSSL_NONQUIC=$(get_old_ver "$PREV_TAG_NONQUIC_OLD" "versions/openssl.txt")
          OLD_NGTCP2=$(get_old_ver "$PREV_TAG_QUIC_OLD" "versions/ngtcp2.txt")
          OLD_NGHTTP3=$(get_old_ver "$PREV_TAG_QUIC_OLD" "versions/nghttp3.txt")
          OLD_OPENSSL_QUIC=$(get_old_ver "$PREV_TAG_QUIC_OLD" "versions/openssl.txt")

          UPDATED_OPENSSL_NONQUIC=false
          if [ "$OPENSSL" != "$OLD_OPENSSL_NONQUIC" ] && [ "$OPENSSL" != "none" ]; then
            UPDATED_OPENSSL_NONQUIC=true
          fi

          UPDATED_OPENSSL_QUIC=false
          if [ "$OPENSSL" != "$OLD_OPENSSL_QUIC" ] && [ "$OPENSSL" != "none" ]; then
            UPDATED_OPENSSL_QUIC=true
          fi

          UPDATED_NGTCP2=false
          if [ "$NGTCP2" != "$OLD_NGTCP2" ] && [ "$NGTCP2" != "none" ]; then
            UPDATED_NGTCP2=true
          fi

          UPDATED_NGHTTP3=false
          if [ "$NGHTTP3" != "$OLD_NGHTTP3" ] && [ "$NGHTTP3" != "none" ]; then
            UPDATED_NGHTTP3=true
          fi

          if [ "$UPDATED_NGTCP2" = true ] && [ "$UPDATED_NGHTTP3" = false ]; then
            UPDATED_NGHTTP3=true
          fi

          CREATE_NONQUIC=false
          if [ "$UPDATED_OPENSSL_NONQUIC" = true ]; then
            CREATE_NONQUIC=true
          fi

          CREATE_QUIC=false
          if [ "$UPDATED_OPENSSL_QUIC" = true ] || [ "$UPDATED_NGTCP2" = true ] || [ "$UPDATED_NGHTTP3" = true ]; then
            CREATE_QUIC=true
          fi

          REF_PREV_TAG="${PREV_TAG_QUIC_OLD:-$PREV_TAG_NONQUIC_OLD}"
          
          NEW_CONTRIB_CONTENT=""
          if [ -n "$REF_PREV_TAG" ]; then
            EXISTING_EMAILS=$(git log "$REF_PREV_TAG" --format='%ae' 2>/dev/null | sort -u || true)
            BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
            
            PRS_JSON=$(gh pr list --base "$BRANCH" --state merged --json author,number,headRefName,mergedAt --limit 200 2>/dev/null || echo "[]")
            
            TMP_FILE="/tmp/new_contribs_$$.txt"
            rm -f "$TMP_FILE"
            touch "$TMP_FILE"

            if [ "$(echo "$PRS_JSON" | jq -r '. | length')" -gt 0 ]; then
              echo "$PRS_JSON" | jq -c '.[]' | while read -r pr; do
                PR_NUM=$(echo "$pr" | jq -r '.number')
                AUTHOR_LOGIN=$(echo "$pr" | jq -r '.author.login')
                
                if [[ "$AUTHOR_LOGIN" == *"github-actions"* ]] || \
                   [[ "$AUTHOR_LOGIN" == *"madnuttah-bot"* ]] || \
                   [[ "$AUTHOR_LOGIN" == *"dependabot"* ]] || \
                   [[ "$AUTHOR_LOGIN" == *"renovate[bot]" ]]; then
                  continue
                fi

                AUTHOR_EMAIL=$(gh api "repos/${{ github.repository }}/contributors" --jq ".[] | select(.login == \"$AUTHOR_LOGIN\") | .email" 2>/dev/null || echo "")
                if [ -z "$AUTHOR_EMAIL" ]; then
                  MERGE_COMMIT=$(gh pr view "$PR_NUM" --json mergeCommit --jq '.mergeCommit.oid' 2>/dev/null || echo "")
                  if [ -n "$MERGE_COMMIT" ]; then
                    AUTHOR_EMAIL=$(git log -1 --format='%ae' "$MERGE_COMMIT" 2>/dev/null || echo "")
                  fi
                fi

                IS_NEW=true
                if [ -n "$AUTHOR_EMAIL" ]; then
                  if echo "$EXISTING_EMAILS" | grep -q "^${AUTHOR_EMAIL}$"; then
                    IS_NEW=false
                  fi
                fi

                if [ "$IS_NEW" = true ]; then
                  printf "* [%s](https://github.com/%s) made their first contribution in #%s\n" "$AUTHOR_LOGIN" "$AUTHOR_LOGIN" "$PR_NUM" >> "$TMP_FILE"
                fi
              done
            fi

            if [ -s "$TMP_FILE" ]; then
              NEW_CONTRIB_CONTENT=$(printf "\n### New contributors\n\n%s\n" "$(cat "$TMP_FILE")")
            fi
            rm -f "$TMP_FILE"
          fi

          if [ "$CREATE_NONQUIC" = true ]; then
            rm -f RELEASE_NOTES_NONQUIC.md
            {
              printf "## %s <madnuttah-bot>\n\n" "$TODAY"
              printf "### What's changed?\n\n"

              if [ "$UPDATED_OPENSSL_NONQUIC" = true ]; then
                printf "* Updated OpenSSL to %s\n" "$OPENSSL"
                printf "  Changelog: https://github.com/openssl/openssl/releases/tag/openssl-%s\n\n" "$OPENSSL"
              fi

              if [ "$UPDATED_OPENSSL_NONQUIC" = false ]; then
                 printf "* No component updates in this release.\n\n"
              fi

              printf "%s" "$NEW_CONTRIB_CONTENT"
            } >> RELEASE_NOTES_NONQUIC.md
          fi

          if [ "$CREATE_QUIC" = true ]; then
            rm -f RELEASE_NOTES_QUIC.md
            {
              printf "## %s <madnuttah-bot>\n\n" "$TODAY"
              printf "### OpenSSL+QUIC Buildenv %s\n\n" "$QUIC"
              printf "### What's changed?\n\n"

              if [ "$UPDATED_OPENSSL_QUIC" = true ]; then
                printf "* Updated OpenSSL to %s\n" "$OPENSSL"
                printf "  Changelog: https://github.com/openssl/openssl/releases/tag/openssl-%s\n\n" "$OPENSSL"
              fi

              if [ "$UPDATED_NGTCP2" = true ]; then
                printf "* Updated ngtcp2 to %s\n" "$NGTCP2"
                printf "  Changelog: https://github.com/ngtcp2/ngtcp2/releases/tag/%s\n\n" "$NGTCP2"
              fi

              if [ "$UPDATED_NGHTTP3" = true ]; then
                printf "* Updated nghttp3 to %s\n" "$NGHTTP3"
                printf "  Changelog: https://github.com/ngtcp2/nghttp3/releases/tag/%s\n\n" "$NGHTTP3"
              fi

              if [ "$UPDATED_OPENSSL_QUIC" = false ] && [ "$UPDATED_NGTCP2" = false ] && [ "$UPDATED_NGHTTP3" = false ]; then
                 printf "* No component updates in this release.\n\n"
              fi

              printf "%s" "$NEW_CONTRIB_CONTENT"
            } >> RELEASE_NOTES_QUIC.md
          fi

          if [ "$CREATE_NONQUIC" = true ]; then
            if ! git rev-parse "$TAG_NONQUIC" >/dev/null 2>&1; then
              git tag -a "$TAG_NONQUIC" -m "$TAG_NONQUIC"
              git push origin "$TAG_NONQUIC"
              if ! git rev-parse --verify "origin/$NONQUIC" >/dev/null 2>&1; then
                git checkout -b "$NONQUIC" "$TAG_NONQUIC"
                git push --set-upstream origin "$NONQUIC"
              fi
            fi

            gh release create "$TAG_NONQUIC" \
              -t "$TAG_NONQUIC" \
              -F RELEASE_NOTES_NONQUIC.md \
              --latest || true
          fi

          if [ "$CREATE_QUIC" = true ]; then
            if ! git rev-parse "$TAG_QUIC" >/dev/null 2>&1; then
              git tag -a "$TAG_QUIC" -m "$TAG_QUIC"
              git push origin "$TAG_QUIC"
              if ! git rev-parse --verify "origin/$QUIC" >/dev/null 2>&1; then
                git checkout -b "$QUIC" "$TAG_QUIC"
                git push --set-upstream origin "$QUIC"
              fi
            fi

            gh release create "$TAG_QUIC" \
              -t "$TAG_QUIC" \
              -F RELEASE_NOTES_QUIC.md \
              --latest || true
          fi

          if [ "$CREATE_NONQUIC" = false ] && [ "$CREATE_QUIC" = false ]; then
            echo "No component updates detected for either variant. Skipping release creation."
          fi
