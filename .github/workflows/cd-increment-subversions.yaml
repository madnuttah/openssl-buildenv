name: CD Increment OpenSSL Subversions

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - versions/openssl.txt
      - versions/ngtcp2.txt

permissions:
  contents: write

jobs:
  bump-sub:
    if: github.event.sender.login == 'renovate[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with:
          egress-policy: audit
          
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Import GPG key
        id: IMPORT_GPG
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false
          git_push_gpgsign: false
          trust_level: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Process Subversion Logic
        shell: python
        run: |
          import re
          import os
          import sys
          import subprocess
          new_openssl_version = ""
          if os.path.exists("versions/openssl.txt"):
              with open("versions/openssl.txt", "r") as f:
                  new_openssl_version = f.read().strip()
              print(f"Target OpenSSL version from openssl.txt: {new_openssl_version}")
          else:
              print("ERROR: versions/openssl.txt not found")
              sys.exit(1)

          def update_buildenv_file(filepath, target_version):
              """Update the buildenv file to the target version and reset subversion to 0."""
              if not os.path.exists(filepath):
                  print(f"File not found: {filepath}")
                  return False

              with open(filepath, 'r') as f:
                  content = f.read().strip()
              match = re.search(r'openssl=(\d+\.\d+\.\d+)-(\d+)(-quic)?', content)
              if not match:
                  print(f"ERROR: No version pattern found in {filepath}")
                  return False

              old_base = match.group(1)
              old_sub = int(match.group(2))
              suffix = match.group(3) or ""
              new_sub = 0
              
              new_version = f"openssl={target_version}-{new_sub}{suffix}"

              with open(filepath, 'w') as f:
                  f.write(new_version + "\n")

              print(f"Updated {filepath}: {old_base}-{old_sub}{suffix} -> {new_version}")
              return True

          def get_changed_files():
              """Get files changed compared to main branch base SHA."""
              try:
                  base_ref = "${{ github.event.pull_request.base.ref }}"
                  subprocess.run(["git", "fetch", "origin", base_ref], check=False)
                  result = subprocess.run(
                      ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
                      capture_output=True,
                      text=True,
                      check=False
                  )
                  return result.stdout.strip().split('\n') if result.stdout.strip() else []
              except Exception as e:
                  print(f"Warning: Could not get changed files: {e}")
                  return []

          changed = False
          changed_files = get_changed_files()

          openssl_changed = "versions/openssl.txt" in changed_files
          ngtcp2_changed = "versions/ngtcp2.txt" in changed_files

          print(f"Changed files: {changed_files}")
          print(f"OpenSSL changed: {openssl_changed}")
          print(f"ngtcp2 changed: {ngtcp2_changed}")

          if openssl_changed:
              print(f"OpenSSL core changed -> syncing buildenv files to {new_openssl_version} and resetting subversions to 0")
              if update_buildenv_file('versions/openssl-buildenv.txt', new_openssl_version):
                  changed = True
              if update_buildenv_file('versions/openssl-quic-buildenv.txt', new_openssl_version):
                  changed = True

          if ngtcp2_changed:             
              def increment_subversion(filepath):
                  if not os.path.exists(filepath):
                      return False
                  with open(filepath, 'r') as f:
                      content = f.read().strip()
                  match = re.search(r'openssl=(\d+\.\d+\.\d+)-(\d+)(-quic)?', content)
                  if not match:
                      print(f"ERROR: No version pattern found in {filepath}")
                      return False
                  base = match.group(1)
                  old_sub = int(match.group(2))
                  suffix = match.group(3) or ""
                  new_sub = old_sub + 1
                  new_version = f"openssl={base}-{new_sub}{suffix}"
                  with open(filepath, 'w') as f:
                      f.write(new_version + "\n")
                  print(f"Incremented {filepath}: {base}-{old_sub}{suffix} -> {new_version}")
                  return True

              print("ngtcp2 changed -> bumping QUIC subversion only")
              if increment_subversion('versions/openssl-quic-buildenv.txt'):
                  changed = True

          expected_change = openssl_changed or ngtcp2_changed

          if not changed:
              if expected_change:
                  print("::error::Expected to bump subversion for a relevant file, but no changes were made. Failing pipeline.")
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write("HAS_CHANGES=false\n")
                  sys.exit(1)
              else:
                  print("PR does not affect OpenSSL or ngtcp2 dependency versions. Skipping commit step.")
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write("HAS_CHANGES=false\n")
                  sys.exit(0)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write("HAS_CHANGES=true\n")
              
      - name: Export PR branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"

      - name: Commit and Push Changes
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          
          git config --local user.name "${{ steps.IMPORT_GPG.outputs.name }}"
          git config --local user.email "${{ steps.IMPORT_GPG.outputs.email }}"
          
          echo "Fetching latest state of $PR_BRANCH..."
          git fetch origin "$PR_BRANCH"
          
          git add versions/*.txt
          
          if git diff --staged --quiet; then
            echo "No real differences to commit."
          else
            git commit -m "fix: auto-manage openssl subversion"
            git push origin HEAD:"$PR_BRANCH"
          fi